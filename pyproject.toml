[tool.poetry]
name = "datascience-docker"
version = "1.0.0"
description = "Ambiente reproducible de desarrollo para Ciencia de Datos"
authors = ["Kuautli <cuauhtemocbe@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
pandas = ">=2.2.1,<4.0.0"
ipykernel = ">=6.29.4,<8.0.0"
scikit-learn = "^1.4.2"
jupyterlab = "^4.1.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = ">=0.25,<1.5"
pytest-cov = "^6.0.0"
ruff = ">=0.9,<0.17"
mypy = ">=1.14,<3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    ".", "src"
]
testpaths = [
    "tests"
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
mypy_path = "src"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
